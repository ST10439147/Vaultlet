[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultlet"
version = "0.1.0"
description = "Local-first, zero-knowledge password manager"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi",
    "cryptography",
    "pyperclip",
    "pyotp",
    "textual",
    "typer",
]

[project.scripts]
vaultlet = "vaultlet.cli:app"
vaultlet-server = "vaultlet.server:main"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx", "vaultlet[server]"]

[tool.setuptools.packages.find]
where = ["src"]
