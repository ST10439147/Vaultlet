[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultlet"
version = "0.1.0"
description = "Local-first, zero-knowledge password manager"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi",
    "cryptography",
    "pyperclip",
    "textual",
    "typer",
]

[project.scripts]
vaultlet = "vaultlet.cli:app"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
